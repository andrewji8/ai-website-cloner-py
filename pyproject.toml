[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-website-cloner-py"
version = "0.1.0"
description = "Python refactor & Playwright extension of the ai-website-cloner-template"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["playwright>=1.40"]

[project.scripts]
clone-site = "cloner.cli:main"

[tool.setuptools]
packages = ["cloner"]
